# ─────────────────────────────────────────────────────────────
# 生产部署（2 vCPU / 2 GiB）：精简版，去掉 Prometheus + Grafana。
#   启动:  docker compose -f docker-compose.prod.yml up -d --build
#   前端:  https://aikirito.cloud
#   管理端: https://aikirito.cloud:8001
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=50

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M

  app:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    volumes:
      # 生产服务器权威运行数据；deploy-server.sh 会在 git reset 前后保护
      # ai-providers/.secrets，避免后台保存的 Key 配置被代码部署覆盖。
      - ./data:/app/data
      - ./resouce:/app/resouce:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  admin:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "admin.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    volumes:
      # 与 app 共用同一宿主机 data，保证后台保存后用户端立即可读取。
      - ./data:/app/data
      - ./resouce:/app/resouce:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.tasks.worker"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    volumes:
      # worker 也需读取同一份加密供应商配置与主密钥。
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/_active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
      - "8001:8001"
    depends_on:
      - app
      - admin
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  pg_data:
  redis_data:
  certbot_www:
  certbot_certs:
