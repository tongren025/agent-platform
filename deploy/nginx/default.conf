upstream app_backend {
    server app:8000;
}

upstream admin_backend {
    server admin:8001;
}

# HTTP → HTTPS 重定向（保留 ACME 验证路径）
server {
    listen 80;
    server_name aikirito.cloud www.aikirito.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 用户端
server {
    listen 443 ssl;
    server_name aikirito.cloud www.aikirito.cloud;

    ssl_certificate     /etc/letsencrypt/live/aikirito.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikirito.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # 静态资源缓存
    location /assets/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 用户端 API + SPA
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# 管理端（8001，也走 HTTPS）
server {
    listen 8001 ssl;
    server_name aikirito.cloud www.aikirito.cloud;

    ssl_certificate     /etc/letsencrypt/live/aikirito.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikirito.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass http://admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
